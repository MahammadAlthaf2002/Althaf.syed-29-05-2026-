<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Performance Analyzer</h1>

        <p class="subtitle">
            Enter student details and check the performance
        </p>

        <form id="studentForm">

            <!-- Student Name -->
            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                >
            </div>

            <!-- JavaScript Marks -->
            <div class="form-group">
                <label for="javascriptMarks">JavaScript Marks</label>
                <input
                    type="number"
                    id="javascriptMarks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                >
            </div>

            <!-- React Marks -->
            <div class="form-group">
                <label for="reactMarks">React Marks</label>
                <input
                    type="number"
                    id="reactMarks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                >
            </div>

            <!-- HTML Marks -->
            <div class="form-group">
                <label for="htmlMarks">HTML Marks</label>
                <input
                    type="number"
                    id="htmlMarks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                >
            </div>

            <!-- CSS Marks -->
            <div class="form-group">
                <label for="cssMarks">CSS Marks</label>
                <input
                    type="number"
                    id="cssMarks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                >
            </div>

            <!-- Attendance -->
            <div class="form-group">
                <label for="attendance">Attendance %</label>
                <input
                    type="number"
                    id="attendance"
                    placeholder="Enter attendance"
                    min="0"
                    max="100"
                >
            </div>

            <!-- Course -->
            <div class="form-group">
                <label for="course">Select Course</label>

                <select id="course">

                    <option value="javascript">
                        JavaScript
                    </option>

                    <option value="react">
                        React
                    </option>

                    <option value="fullstack">
                        Full Stack
                    </option>

                </select>
            </div>

            <button type="submit">
                Analyze Performance
            </button>

        </form>

        <!-- Result -->
        <div id="result" class="result">

            <h2>Result</h2>

            <p id="resultMessage">
                Enter your details above.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
